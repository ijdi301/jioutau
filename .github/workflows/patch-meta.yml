name: patch-meta
on:
  push:
    paths:
      - '.github/workflows/patch-meta.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply meta rewrite
        run: |
          python3 - <<'PY'
          import re

          NEW = {
           "beginner.html": {
            "title":"宜蘭新手攀岩入門指南｜抱石是什麼？第一次來要準備什麼",
            "desc":"第一次攀岩該穿什麼？抱石和上攀有什麼不同？一次看懂抱石規則、著裝建議與安全須知，第一次到宜蘭攀岩就上手。",
            "ogtitle":"新手攀岩入門指南｜抱石是什麼？第一次來要準備什麼",
            "ogdesc":"抱石規則、著裝建議與安全須知一次看懂，讓你第一次到宜蘭攀岩就上手。"},
           "courses.html": {
            "title":"宜蘭攀岩課程與收費｜體驗課・團體班・一對一教練課",
            "desc":"入門體驗課、四週團體課程、一對一教練課與小朋友課程，不定期開龍洞戶外攀岩與溯溪團。價格以現場公告為準，報名電話 0986-567-929。",
            "ogtitle":"宜蘭攀岩課程與收費｜體驗課・團體班・一對一教練課",
            "ogdesc":"從完全沒爬過到進階訓練，久淘都有對應的課程。價格以現場公告為準。"},
           "faq.html": {
            "title":"宜蘭攀岩常見問題｜費用・預約・兒童年齡｜久淘攀岩抱石館",
            "desc":"完全沒爬過可以去嗎？要預約嗎？小朋友幾歲可以來？費用怎麼算？久淘攀岩抱石館的常見問題一次解答，還有疑問歡迎來電 0986-567-929。",
            "ogtitle":"宜蘭攀岩常見問題｜費用・預約・兒童年齡",
            "ogdesc":"完全沒爬過可以去嗎？要預約嗎？小朋友幾歲可以來？一次解答你的疑問。"},
           "contact.html": {
            "title":"宜蘭攀岩館交通｜近新月廣場・久淘攀岩抱石館-宜蘭店",
            "desc":"宜蘭縣宜蘭市健康路三段 66 號，近新月廣場步行約 3 分鐘。附 Google 地圖、開車與停車建議、營業時間與電話 0986-567-929。",
            "ogtitle":"宜蘭攀岩館交通與聯絡｜近新月廣場",
            "ogdesc":"附 Google 地圖、交通與停車建議，以及電話與官方 LINE。近新月廣場步行約 3 分鐘。"},
           "grasp.html": {
            "title":"宜蘭 GRASP 攀岩粉｜日本製碳酸鎂｜久淘攀岩抱石館台灣代理",
            "desc":"來自日本佐賀、與世界級攀岩者小山田大共同開發的碳酸鎂粉。依手汗量與氣候分 Regular、Wet、Dry 等配方，久淘為台灣代理，宜蘭店可洽詢。",
            "ogtitle":"宜蘭 GRASP 攀岩粉｜日本製碳酸鎂｜久淘為台灣代理",
            "ogdesc":"來自日本佐賀，與世界級攀岩者小山田大共同開發。Regular、Wet、Dry、Chunky、Itadaki 系列，久淘為台灣代理。"},
           "about.html": {
            "title":"關於久淘攀岩抱石館｜從冬山到宜蘭市，讓更多人認識攀岩",
            "desc":"2022 年 7 月從冬山遷到宜蘭市，館長陳信豪與團隊持續以課程與競賽推廣在地攀岩運動，曾參與體育署「運動 i 台灣」推廣班。",
            "ogtitle":"關於久淘攀岩抱石館-宜蘭店",
            "ogdesc":"2022 年 7 月從冬山遷到宜蘭市，館長陳信豪與團隊持續以課程與競賽推廣宜蘭在地攀岩運動。"},
          }

          def sub(s, pat, val):
              m = re.search(pat, s, re.S)
              if not m:
                  return s, False
              return s[:m.start()] + m.group(0).replace(m.group(1), val, 1) + s[m.end():], True

          for f, v in NEW.items():
              s = open(f, encoding="utf-8").read()
              s, a = sub(s, r'<title>(.*?)</title>', v["title"])
              s, b = sub(s, r'<meta name="description" content="(.*?)">', v["desc"])
              s, c = sub(s, r'<meta property="og:title" content="(.*?)">', v["ogtitle"])
              s, d = sub(s, r'<meta property="og:description" content="(.*?)">', v["ogdesc"])
              open(f, "w", encoding="utf-8").write(s)
              print(f, a, b, c, d)
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name "ijdi301"
          git config user.email "ijdi301@gmail.com"
          git rm -q .github/workflows/patch-meta.yml
          git add -A
          git commit -m "fix: 括號錯字修正(110處) + SEO title/description/og 改寫 (8 pages)"
          git push
