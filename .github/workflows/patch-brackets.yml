name: patch-brackets
on:
  push:
    paths:
      - '.github/workflows/patch-brackets.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix bracket typo
        run: |
          python3 - <<'PY'
          import glob
          BAD = "（JT Climbing)"
          GOOD = "（JT Climbing）"
          total = 0
          for f in sorted(glob.glob("*.html")):
              s = open(f, encoding="utf-8").read()
              n = s.count(BAD)
              if n:
                  open(f, "w", encoding="utf-8").write(s.replace(BAD, GOOD))
              total += n
              print(f, n)
          print("TOTAL", total)
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name "ijdi301"
          git config user.email "ijdi301@gmail.com"
          git rm -q .github/workflows/patch-brackets.yml
          git add -A
          git commit -m "fix: 括號錯字修正（全站 110 處）"
          git push
